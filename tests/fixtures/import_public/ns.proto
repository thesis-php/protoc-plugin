syntax = "proto3";

package t.pub.ns;

// Re-exported types live in the namespace of the file that declares them,
// not in the one of the file that re-exports them.
option php_namespace = "Test\\ImportPublic\\Custom";

enum Color {
  COLOR_UNSPECIFIED = 0;
  COLOR_RED = 1;
  COLOR_GREEN = 2;
}

message Box {
  message Item {
    string name = 1;
  }

  Item item = 1;
  Color color = 2;
}
