edition = "2023";

package oneof.variants.editions;

enum Level {
    LEVEL_UNSPECIFIED = 0;
    LEVEL_HIGH = 1;
}

message Inner {
    int32 value = 1;
}

// Oneof fields have explicit presence, yet a variant is not nullable: its class exists
// only once the oneof is set to it. A message variant stays nullable, as everywhere.
message Choice {
    oneof value {
        int32 number = 1;
        string text = 2;
        Level level = 3;
        Inner inner = 4;
    }

    // The declared default becomes the default of the variant.
    oneof defaulted {
        int32 number_default = 11 [default = 42];
        string text_default = 12 [default = "hello"];
        Level level_default = 13 [default = LEVEL_HIGH];
    }
}
