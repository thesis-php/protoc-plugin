edition = "2023";

package groups.editions.field.v1;

message Inner {
    int32 value = 1;
}

// features.message_encoding is LENGTH_PREFIXED by default: a message field is a group only with DELIMITED.
message Delimited {
    Inner required = 1 [features.message_encoding = DELIMITED, features.field_presence = LEGACY_REQUIRED];
    Inner plain = 2;
    Inner single = 3 [features.message_encoding = DELIMITED];
    repeated Inner list = 4 [features.message_encoding = DELIMITED];

    oneof choice {
        Inner variant = 5 [features.message_encoding = DELIMITED];
        Inner variant_plain = 6;
    }
}

